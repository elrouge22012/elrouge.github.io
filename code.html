<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Encoder & Decoder</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.9);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-glow: #00f0ff;
            --input-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(56, 189, 248, 0.2);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.15), transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-position: center center;
        }

        /* Container Wrapper with Animated Rainbow Gradient Border */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 550px;
            border-radius: var(--radius);
            padding: 3px; /* Controls border thickness */
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animated Rotating Color Background */
        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                #ff007f, 
                #7928ca, 
                #0070f3, 
                #00dfd8, 
                #ff007f
            );
            animation: rotateBorder 4s linear infinite;
        }

        /* Blur Effect for Soft Outer Glow */
        .card-wrapper::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                #ff007f, 
                #7928ca, 
                #0070f3, 
                #00dfd8, 
                #ff007f
            );
            animation: rotateBorder 4s linear infinite;
            filter: blur(15px);
            opacity: 0.7;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: calc(var(--radius) - 3px);
            padding: 36px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 28px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite, textGlow 2s ease-in-out infinite alternate;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUp 0.6s ease forwards;
        }

        .section:nth-of-type(1) {
            animation-delay: 0.2s;
        }

        .section:nth-of-type(2) {
            animation-delay: 0.4s;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
            margin: 28px 0;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
            background-color: rgba(15, 23, 42, 0.95);
        }

        input[readonly] {
            background-color: rgba(11, 15, 25, 0.7);
            color: var(--accent-glow);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
            font-weight: bold;
        }

        button {
            padding: 12px 22px;
            background: linear-gradient(135deg, var(--accent-primary), #0284c7);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            color: #ffffff;
        }

        button:active {
            transform: translateY(0);
        }

        /* Keyframe Animations */
        @keyframes rotateBorder {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @keyframes textGlow {
            from {
                filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2));
            }
            to {
                filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
            }
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="container">
            <h1>Binary Codec</h1>

            <!-- Encoder Section -->
            <div class="section">
                <label for="tt">Text to Encode (Text &rarr; Binary)</label>
                <div class="input-group">
                    <input type="text" id="tt" name="tt" placeholder="Enter text here...">
                    <button type="button" onclick="salem()">Encode</button>
                </div>

                <label for="res">Result</label>
                <input type="text" id="res" readonly placeholder="Binary output will appear here...">
            </div>

            <div class="divider"></div>

            <!-- Decoder Section -->
            <div class="section">
                <label for="bb">Binary to Decode (Binary &rarr; Text)</label>
                <div class="input-group">
                    <input type="text" id="bb" name="bb" placeholder="Enter 8-bit binary string...">
                    <button type="button" onclick="salem2()">Decode</button>
                </div>

                <label for="ress">Result</label>
                <input type="text" id="ress" readonly placeholder="Decoded text will appear here...">
            </div>
        </div>
    </div>

    <script>
        function salem(){
            var ch = document.getElementById('tt').value;
            var ch2 = "";
            for(var i = 0; i < ch.length; i++){
                var ch3 = "";
                var s = Number(ch[i].charCodeAt(0));
                while(s > 0){
                    ch3 = String(Math.floor(s % 2)) + ch3;
                    s = Math.floor(s / 2);
                }
                while(ch3.length != 8){
                    ch3 = "0" + ch3;
                }
                ch2 = ch2 + ch3;
            }
            document.getElementById('res').value = ch2;
        }

        function salem2(){
            var ch = "";
            var aa = document.getElementById('bb').value;
            while(aa != ""){
                var ch2 = aa.substring(0, 8);
                aa = aa.substring(8);
                var p = 1;
                var s = 0;
                for(var i = ch2.length - 1; i >= 0; i--){
                    s = s + Number(ch2[i]) * p;
                    p = p * 2;
                }
                ch = ch + String.fromCharCode(s);
            }
            document.getElementById('ress').value = ch;
        }
    </script>
</body>
</html>
